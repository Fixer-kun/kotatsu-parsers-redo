name: Daily Sync & JitPack Trigger

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from phone

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync Fork from Upstream (Preserving Custom Files)
      id: sync
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # File path to keep untouched
        PROTECTED_FILE="src/main/kotlin/org/koitharu/kotatsu/parsers/site/madara/en/MangaDistrict.kt"

        # Add original Kotatsu-Redo upstream repository
        git remote add upstream https://github.com/Kotatsu-Redo/kotatsu-parsers-redo.git || true
        git fetch upstream master

        # Save current local commit hash
        LOCAL_HASH=$(git rev-parse HEAD)
        UPSTREAM_HASH=$(git rev-parse upstream/master)

        echo "Local commit   : $LOCAL_HASH"
        echo "Upstream commit: $UPSTREAM_HASH"

        if [ "$LOCAL_HASH" = "$UPSTREAM_HASH" ]; then
          echo "No new commits found. Fork is up to date."
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "New commits detected! Syncing master branch while preserving custom files..."
          
          # Perform merge without auto-committing
          git merge upstream/master --no-commit --no-ff || true

          # Restore your custom implementation from before the merge attempt
          git checkout "$LOCAL_HASH" -- "$PROTECTED_FILE"
          git add "$PROTECTED_FILE"

          # Finalize the merge commit
          git commit -m "Chore: Sync upstream changes (Preserved custom MangaDistrict.kt)" || true
          git push origin master

          NEW_HASH=$(git rev-parse HEAD)
          echo "Updated to commit: $NEW_HASH"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "commit_hash=$NEW_HASH" >> $GITHUB_OUTPUT
        fi

    - name: Trigger JitPack Build
      if: steps.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        COMMIT_HASH=${{ steps.sync.outputs.commit_hash }}
        if [ -z "$COMMIT_HASH" ]; then
          COMMIT_HASH=$(git rev-parse HEAD)
        fi

        echo "Pinging JitPack for full commit: $COMMIT_HASH"
        
        # Request the POM file from JitPack using the full 40-character commit hash to force build initialization
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://jitpack.io/com/github/Fixer-kun/kotatsu-parsers-redo/$COMMIT_HASH/kotatsu-parsers-redo-$COMMIT_HASH.pom")
        
        echo "JitPack response code: $HTTP_CODE"
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
          echo "JitPack build successfully triggered!"
        else
          echo "JitPack ping returned status $HTTP_CODE. Check https://jitpack.io/#Fixer-kun/kotatsu-parsers-redo for progress."
        fi
