name: JitPack Trigger

on:
  workflow_dispatch: # Manual button trigger from phone

jobs:
  ping-jitpack:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Trigger JitPack Build
      run: |
        COMMIT_HASH=$(git rev-parse --short=7 HEAD)
        echo "Pinging JitPack for short commit hash: $COMMIT_HASH"
        
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://jitpack.io/com/github/Fixer-kun/kotatsu-parsers-redo/$COMMIT_HASH/kotatsu-parsers-redo-$COMMIT_HASH.pom")
        
        echo "JitPack response code: $HTTP_CODE"
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
          echo "JitPack build successfully triggered!"
        else
          echo "JitPack status: $HTTP_CODE. Check https://jitpack.io/#Fixer-kun/kotatsu-parsers-redo"
        fi
